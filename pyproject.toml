[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "photosort"
version = "0.1.0"
description = "Safe CLI photo organizer: sort by date, never lose a frame"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "piexif>=1.1"]

[project.scripts]
photosort = "photosort.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["photosort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
